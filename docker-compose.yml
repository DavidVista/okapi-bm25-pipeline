services:
  cluster-master:
    image: firasj/spark-docker-cluster
    container_name: cluster-master
    mem_limit: 5g
    environment:
      - JVM_OPTS=-Xms4g -Xmx4g -XX:+UseG1GC
    ports:
      - "8088:8088"
      - "4040:4040"
      - "19888:19888"
      - "9000:9000"
      - "9870:9870"
    volumes:
      - "./app:/app"
    networks:
      - spark-cluster
    depends_on:
      - cluster-slave-1
      - scylla-server
    hostname: cluster-master
    tty: true
    working_dir: /app
    # You can comment the entrypoint to run the script manually inside the container
    entrypoint: 
      - bash
      - /app/app.sh
    
  cluster-slave-1:
    image: firasj/spark-docker-cluster
    container_name: cluster-slave-1
    mem_limit: 2g
    environment:
      - JVM_OPTS=-Xms1g -Xmx1g -XX:+UseG1GC
    networks:
      - spark-cluster
    hostname: cluster-slave-1
    tty: true
  # cluster-slave-2:
  #   image: firasj/spark-docker-cluster
  #   container_name: cluster-slave-2
  #   networks:
  #     - spark-cluster
  #   depends_on:
  #     - cluster-slave-1
  #   hostname: cluster-slave-2
  #   tty: true
  scylla-server:
    image: scylladb/scylla
    container_name: scylla-server
    # Enforce memory limits
    mem_limit: 4g
    environment:
      - SCYLLA_CMDLINE_OPTIONS=--memory 2G --smp 2 --overprovisioned
    ports:
      - "7000:7000"
    networks:
      - spark-cluster
    

networks:
  spark-cluster:
    driver: bridge
